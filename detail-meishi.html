<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美式咖啡 - 详情</title>
  <link rel="stylesheet" href="style.css" />

  <!-- 可选：引入 Font Awesome（更专业的图标） -->
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> -->

  <style>
    /* 购物车浮动按钮样式 */
    #cart-float-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background-color: #ff6f00;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    /* 提示消息样式 */
    #cart-message {
      position: fixed;
      bottom: 80px; /* 在按钮上方 */
      right: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 1001;
    }

    #cart-message.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
<div class="detail-container">
  <div class="detail-header">
    <a href="menu1.html" class="back-btn">← 返回</a>
    <h1>美式咖啡</h1>
  </div>

  <div class="detail-image">
    <img src="images/iced-americano.jpg" alt="美式咖啡" />
  </div>

  <div class="detail-content">
    <p><strong>做法：</strong>意式浓缩咖啡加热水稀释</p>
    <p><strong>浓度：</strong>清爽低浓度，保留咖啡油脂香气</p>
    <p><strong>风味描述：</strong>干净明亮，微苦回甘，带有坚果与可可尾韵</p>
    <p><strong>咖啡因含量：</strong>较高（约150mg/杯）</p>
    <p><strong>适合时段：</strong>早晨提神、工作专注时刻</p>
    <p><strong>健康提示：</strong>空腹慎饮，建议搭配小食</p>
  </div>

  <div class="detail-footer">
    <div class="price">¥28</div>
    <button class="add-to-cart" onclick="simulateAddToCart()">加入购物车</button>
  </div>
</div>

<!-- 购物车浮动按钮 -->
<button id="cart-float-btn" onclick="showCartMessage()">🛒</button>
<!-- 提示消息 -->
<div id="cart-message">已加入购物车！</div>

<script>
  function simulateAddToCart() {
    // 模拟商品加入购物车（你可以在这里调用真实逻辑）
    showCartMessage();
  }

  function showCartMessage() {
    const msg = document.getElementById('cart-message');
    msg.classList.add('show');

    setTimeout(() => {
      msg.classList.remove('show');
    }, 2000); // 2秒后自动隐藏
  }
</script>
</body>
</html>
